name: Windows VST3 from source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vst3:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check source resources
        run: python scripts/check_build.py
      - name: Fetch pinned dependencies
        run: python scripts/bootstrap.py
      - name: Check dependency revisions
        run: python scripts/check_build.py --dependencies
      - name: Generate Visual Studio project
        run: cmake --preset windows-vs2022-x64
      - name: Compile source and Windows resources
        run: cmake --build --preset windows-release --parallel 2
      - name: Check new VST3 module and embedded bytes
        run: python scripts/check_build.py --plugin build/windows-x64/out/VintageDrummer.vst3/Contents/x86_64-win/VintageDrummer.vst3
      - name: Include notices
        shell: pwsh
        run: |
          $dest = 'build/windows-x64/out/notices'
          New-Item -ItemType Directory -Force $dest
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dest
          Copy-Item LICENSES "$dest/LICENSES" -Recurse
          Copy-Item .deps/iPlug2/LICENSE.txt "$dest/iPlug2-LICENSE.txt"
          Copy-Item .deps/iPlug2/Dependencies/IPlug/VST3_SDK/LICENSE.txt "$dest/VST3-SDK-LICENSE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VintageDrummer-Windows-x64-from-source
          path: build/windows-x64/out/
          if-no-files-found: error
